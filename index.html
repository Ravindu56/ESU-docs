<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESU Condolence Poster Generator | University of Jaffna</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f3f4f6;
      --panel-bg: #ffffff;
      --text-main: #111827;
      --border: #d1d5db;

      /* Background lilies intensity (0 = hidden, 1 = full) */
      --bg-opacity: 0.14;

      /* Photo frame (assets/photo-frame.png, aspect 1080:1250) */
      --frame-height: 270px;
      --photo-w: 46%;
      --photo-h: 54%;
      --photo-x: 49.3%;
      --photo-y: 63.2%;

      /* Border: lines + corner ornaments (assets/floral-accent.png) */
      --border-inset: 22px;
      --border-width: 2.5px;
      --corner-size: 135px;
      --corner-gap: 100px;
      --corner-offset: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      align-items: flex-start;
    }

    .controls {
      background: var(--panel-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .controls h2 { font-size: 1.2rem; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.85rem; font-weight: 600; color: #374151; }
    .field input, .field select {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; font-family: inherit;
    }
    .btn-download {
      margin-top: 8px; padding: 12px 16px; background: #111827; color: #fff;
      border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .btn-download:hover { background: #374151; }
    .hidden { display: none !important; }

    .poster-wrapper { overflow: auto; max-width: 100%; }

    #poster {
      position: relative;
      width: 900px;
      height: 675px;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      padding: 36px 48px 34px;
      color: #111;
    }

    /* Faded lily background */
    .bg-layer {
      position: absolute; inset: 0; z-index: 0;
      background-image: url('assets/bg-lilies.png');
      background-size: cover;
      background-position: center;
      opacity: var(--bg-opacity);
      pointer-events: none;
    }

    /* Border lines (stop short of the corners) */
    .line { position: absolute; z-index: 2; background: #1a1a1a; pointer-events: none; }
    .line-top, .line-bottom {
      left: calc(var(--border-inset) + var(--corner-gap));
      right: calc(var(--border-inset) + var(--corner-gap));
      height: var(--border-width);
    }
    .line-left, .line-right {
      top: calc(var(--border-inset) + var(--corner-gap));
      bottom: calc(var(--border-inset) + var(--corner-gap));
      width: var(--border-width);
    }
    .line-top { top: var(--border-inset); }
    .line-bottom { bottom: var(--border-inset); }
    .line-left { left: var(--border-inset); }
    .line-right { right: var(--border-inset); }

    /* Corner ornaments: source art is a bottom-left corner piece */
    .corner {
      position: absolute; z-index: 2; pointer-events: none;
      width: var(--corner-size);
    }
    .corner-bl { left: var(--corner-offset); bottom: var(--corner-offset); }
    .corner-tl { left: var(--corner-offset); top: var(--corner-offset); transform: scaleY(-1); }
    .corner-tr { right: var(--corner-offset); top: var(--corner-offset); transform: scale(-1, -1); }
    .corner-br { right: var(--corner-offset); bottom: var(--corner-offset); transform: scaleX(-1); }

    .poster-content {
      position: relative; z-index: 3; flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0 50px;
    }

    .union-header {
      flex-shrink: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-weight: 600; line-height: 1.25; margin-bottom: 6px;
    }

    /* Student photo with wreath frame */
    .photo-container {
      position: relative;
      flex-shrink: 0;
      height: var(--frame-height);
      width: calc(var(--frame-height) * 1080 / 1250);
      margin: 0 auto 4px;
    }
    .student-photo {
      position: absolute; z-index: 1;
      left: var(--photo-x); top: var(--photo-y);
      width: var(--photo-w); height: var(--photo-h);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      object-fit: cover; object-position: center top;
      background: #e5e7eb;
    }
    .photo-frame-img {
      position: absolute; left: 0; top: 0; z-index: 2;
      width: 100%; height: 100%; pointer-events: none;
    }

    .main-title {
      flex-shrink: 0;
      font-family: 'Playfair Display', serif;
      font-size: 36px; font-weight: 700; letter-spacing: 1.5px;
      margin: 4px 0 8px; text-transform: uppercase;
    }

    .description-text {
      flex-shrink: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 600; line-height: 1.3;
      max-width: 640px; color: #111;
    }
    .description-text strong { font-weight: 700; }

    .poster-footer {
      position: relative; z-index: 3;
      background: rgba(180, 180, 180, 0.55);
      padding: 8px 24px; display: flex; align-items: center; justify-content: center;
      gap: 16px; margin: 0 12px;
    }
    .union-logo { width: 46px; height: 46px; object-fit: contain; }
    .footer-text { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="controls">
    <h2>Condolence Poster Generator</h2>

    <div class="field">
      <label for="templateType">Template Type</label>
      <select id="templateType">
        <option value="student">Student Condolence (with Photo)</option>
        <option value="family">Family Condolence (Mother / Father / Sibling)</option>
      </select>
    </div>

    <div class="field" id="relationField">
      <label for="relation">Deceased Relation (Family Template)</label>
      <select id="relation">
        <option value="mother">Mother</option>
        <option value="father">Father</option>
        <option value="brother">Brother</option>
        <option value="sister">Sister</option>
      </select>
    </div>

    <div class="field">
      <label for="personName">Name (Bold)</label>
      <input type="text" id="personName" value="Thamilselvan Thanesh" />
    </div>

    <div class="field">
      <label for="batch">Batch (Bold)</label>
      <input type="text" id="batch" value="E25" />
    </div>

    <div class="field" id="photoField">
      <label for="photoUpload">Student Photo</label>
      <input type="file" id="photoUpload" accept="image/*" />
    </div>

    <button class="btn-download" id="downloadBtn">Download Poster as PNG</button>
  </div>

  <div class="poster-wrapper">
    <div id="poster">
      <div class="bg-layer"></div>

      <div class="line line-top"></div>
      <div class="line line-bottom"></div>
      <div class="line line-left"></div>
      <div class="line line-right"></div>

      <img class="corner corner-tl" src="assets/floral-accent.png?v=2" alt="" />
      <img class="corner corner-tr" src="assets/floral-accent.png?v=2" alt="" />
      <img class="corner corner-bl" src="assets/floral-accent.png?v=2" alt="" />
      <img class="corner corner-br" src="assets/floral-accent.png?v=2" alt="" />

      <div class="poster-content">
        <div class="union-header">
          The Engineering Students’ Union of the<br />
          University of Jaffna extends its,
        </div>

        <div class="photo-container" id="photoContainer">
          <img id="studentPhotoPreview" class="student-photo" alt="Student Photo"
               src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='150' height='180'%3E%3Crect width='100%25' height='100%25' fill='%23e5e7eb'/%3E%3Ctext x='50%25' y='50%25' fill='%239ca3af' font-size='16' text-anchor='middle' font-family='sans-serif'%3EPhoto%3C/text%3E%3C/svg%3E" />
          <img class="photo-frame-img" src="assets/photo-frame.png?v=2" alt="" />
        </div>

        <div class="main-title">HEARTFELT CONDOLENCES</div>
        <div class="description-text" id="posterDescription"></div>
      </div>

      <div class="poster-footer">
        <img class="union-logo" src="assets/%20union-logo.png" alt="ESU Logo" onerror="this.style.display='none'" />
        <div class="footer-text">The Engineering Students’ Union of the University of Jaffna</div>
      </div>
    </div>
  </div>

  <script>
    const templateType = document.getElementById('templateType');
    const relationField = document.getElementById('relationField');
    const relationSelect = document.getElementById('relation');
    const personNameInput = document.getElementById('personName');
    const batchInput = document.getElementById('batch');
    const photoField = document.getElementById('photoField');
    const photoUpload = document.getElementById('photoUpload');
    const photoContainer = document.getElementById('photoContainer');
    const studentPhotoPreview = document.getElementById('studentPhotoPreview');
    const posterDescription = document.getElementById('posterDescription');
    const downloadBtn = document.getElementById('downloadBtn');

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function updatePoster() {
      const type = templateType.value;
      const name = escapeHtml(personNameInput.value.trim() || 'Name');
      const batch = escapeHtml(batchInput.value.trim() || 'E2X');
      const relation = relationSelect.value;

      if (type === 'student') {
        relationField.classList.add('hidden');
        photoField.classList.remove('hidden');
        photoContainer.classList.remove('hidden');
        posterDescription.innerHTML =
          `With profound grief and sadness, we share the passing of our beloved fellow student of the <strong>${batch}</strong> batch,<br/><strong>${name}</strong>.<br/>Our heartfelt sympathies are with his family, friends, and batchmates during this difficult time.`;
      } else {
        relationField.classList.remove('hidden');
        photoField.classList.add('hidden');
        photoContainer.classList.add('hidden');
        posterDescription.innerHTML =
          `With profound sorrow, we extend our deepest sympathies to <strong>${name}</strong> of the <strong>${batch}</strong> batch on the untimely passing of their beloved ${relation}.<br/>May the departed soul rest in peace, and may the family find strength during this time of grief.`;
      }
    }

    photoUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { studentPhotoPreview.src = ev.target.result; };
      reader.readAsDataURL(file);
    });

    [templateType, relationSelect, personNameInput, batchInput].forEach((el) => {
      el.addEventListener('input', updatePoster);
      el.addEventListener('change', updatePoster);
    });

    downloadBtn.addEventListener('click', () => {
      html2canvas(document.getElementById('poster'), { scale: 2, useCORS: true }).then((canvas) => {
        const link = document.createElement('a');
        const safeName = (personNameInput.value.trim() || 'condolence').replace(/\s+/g, '_');
        link.download = `ESU_Condolence_${safeName}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });

    updatePoster();
  </script>
</body>
</html>
